[package]
name = "projgit-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Long-lived projgit daemon: hosts a shared ObjectStore + Fetcher + caches and serves multi-projection FUSE mounts on a unix-socket control plane (Stage 2 of the projgitd plan)."

[lib]
name = "projgit_daemon"
path = "src/lib.rs"

[[bin]]
name = "projgitd"
path = "src/main.rs"

[dependencies]
# The protocol module is platform-agnostic (it's pure serde over a
# Read/Write pair); keep projgit-core off the always-compile path so
# the protocol crate can be depended on by future Windows clients
# without dragging in the server.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = { workspace = true }

# The daemon server (cfg-gated to Linux/macOS) needs the projection
# stack and the FUSE backend. Everything outside `cfg(...)` blocks
# must stay platform-agnostic so the protocol module compiles on
# Windows for future client work.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
projgit-core = { path = "../projgit-core", default-features = false }
projgit-fuse = { path = "../projgit-fuse" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.29", features = ["fs", "user"] }
# `gix::ObjectId` for parsing hex OIDs in the Fetch / PrefetchHeaders
# handlers. Workspace pin so we never drift onto a different gix
# major than projgit-core.
gix = { workspace = true }

[features]
default = []
gvfs-fetcher = ["projgit-core/gvfs-fetcher"]

# Stage 3 sidecar end-to-end test (`tests/sidecar_mount_smoke.rs`)
# drives a FUSE mount from a DaemonFetcher; pulling projgit-fuse as
# a dev-dep keeps the production crate Cargo.toml lean while still
# exercising the full stack from the test.
#
# `tests/xprocess_mount_smoke.rs` additionally spawns the projgitd
# and projgit binaries as separate OS processes and uses
# `nix::sys::signal::kill` to drive their lifecycle — the `signal`
# feature is not needed by the daemon itself (ctrlc handles that)
# so it ships only in dev-deps.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
projgit-fuse = { path = "../projgit-fuse" }
nix = { version = "0.29", features = ["fs", "user", "process", "signal"] }
