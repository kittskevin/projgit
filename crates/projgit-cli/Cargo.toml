[package]
name = "projgit-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for projgit."

[[bin]]
name = "projgit"
path = "src/main.rs"

[dependencies]
# The CLI uses GitCliFetcher for URL-backed mounts and NoopFetcher for
# offline/local mounts. Keep projgit-core's default `gix-fetcher` feature
# off so the binary does not pull gix's HTTP transport stack unless it
# actually needs the experimental native fetcher.
projgit-core = { path = "../projgit-core", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Lightweight Ctrl-C / SIGTERM handler so we can drop the
# `BackgroundSession` and unmount cleanly on shutdown.
ctrlc = { version = "3", features = ["termination"] }
# We construct `gix::ObjectId` from --commit hex. Use the workspace pin
# so we never drift onto a different gix major than projgit-core.
gix = { workspace = true }

# The FUSE backend only exists on Linux + macOS. The CLI's `mount`
# subcommand is cfg-gated to those targets; on other targets it prints
# a friendly "use projgit-winfsp once Phase 3d lands" message.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
projgit-fuse = { path = "../projgit-fuse" }
# `projgit attach` (Stage 2c of the projgitd plan) speaks the daemon's
# unix-socket protocol. The daemon crate is Linux/macOS-only so the
# dep is target-gated too.
projgit-daemon = { path = "../projgit-daemon" }
nix = { version = "0.29", features = ["user"] }

[features]
default = []
gvfs-fetcher = ["projgit-core/gvfs-fetcher"]


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
projgit-daemon = { path = "../projgit-daemon" }
anyhow = "1"
