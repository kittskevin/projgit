[package]
name = "projgit-fuse"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FUSE filesystem backend for projgit (Linux and macOS)."

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# We don't need GixFetcher or network transport deps in the FUSE backend;
# turn off projgit-core's default features so we don't pull reqwest +
# rustls + ring at build time.
projgit-core = { path = "../projgit-core", default-features = false }
fuser = "0.17"
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
# The `mount_smoke` integration test constructs a `Projection::Commit`
# directly, which needs `gix::ObjectId`. Use the same workspace pin as
# projgit-core so we never end up with two versions of gix in the build.
gix = { workspace = true }
