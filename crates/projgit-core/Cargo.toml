[package]
name = "projgit-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core projection engine, object store, and fetcher abstractions for projgit."

[dependencies]
# We extend the lean workspace pin with the blocking transport features
# Phase 0a validated. These pull in reqwest+rustls but compile cleanly
# on Windows / Linux / macOS without system OpenSSL.
gix = { workspace = true, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
bstr = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Tests build small fixture repos at runtime via gix; no extra deps for now.
