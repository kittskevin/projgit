name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check core without native fetcher
        run: cargo check -p projgit-core --no-default-features

      - name: Build
        run: cargo build --workspace --features gvfs-fetcher

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gvfs-fetcher -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --features gvfs-fetcher

      - name: FUSE and daemon mount smoke tests
        run: |
          cargo test -p projgit-fuse --test mount_smoke --test mount_multi --test writable_mount --test passthrough -- --ignored --test-threads=1
          cargo test -p projgit-daemon --test mount_smoke --test sidecar_mount_smoke --test xprocess_mount_smoke --test xns_mount_smoke -- --ignored --test-threads=1
          cargo test -p projgit-cli --test attach_smoke --test writable_mount_cli -- --ignored --test-threads=1

      - name: Privileged FUSE passthrough tests (Linux 6.9+ with CAP_SYS_ADMIN)
        run: |
          kver="$(uname -r)"
          echo "Runner kernel: ${kver}"
          if grep -q '^CONFIG_FUSE_PASSTHROUGH=y' "/boot/config-${kver}" 2>/dev/null \
             || zgrep -q '^CONFIG_FUSE_PASSTHROUGH=y' /proc/config.gz 2>/dev/null; then
            sudo -E env "PATH=$PATH" PROJGIT_REQUIRE_PASSTHROUGH=1 \
              cargo test -p projgit-fuse --test passthrough -- --ignored --nocapture --test-threads=1
          else
            echo "SKIP: runner kernel ${kver} does not enable CONFIG_FUSE_PASSTHROUGH=y"
          fi

  windows:
    name: Rust (Windows + WinFsp)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install WinFsp
        run: choco install winfsp -y --no-progress

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check core without native fetcher
        run: cargo check -p projgit-core --no-default-features

      - name: Build
        run: cargo build --workspace --features gvfs-fetcher

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gvfs-fetcher -- -D warnings

      - name: Test (including live WinFsp mounts)
        env:
          PROJGIT_REQUIRE_WINFSP: "1"
        run: cargo test --workspace --all-targets --features gvfs-fetcher

