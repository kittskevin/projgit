name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check core without native fetcher
        run: cargo check -p projgit-core --no-default-features

      - name: Build
        run: cargo build --workspace --features gvfs-fetcher

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gvfs-fetcher -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --features gvfs-fetcher
